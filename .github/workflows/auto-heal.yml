name: Auto Heal Failed Workflows

on:
  workflow_run:
    workflows: ["CI", "Publish Worker Image", "Publish Worker Image to Docker Hub"]
    types: [completed]

jobs:
  heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Count previous auto-fixes
        id: attempts
        run: |
          COUNT=$(git log --pretty=%s -n 50 | grep -c "chore(auto-fix):" || true)
          echo "attempts=$COUNT" >> $GITHUB_OUTPUT

      - name: Stop if too many attempts
        if: steps.attempts.outputs.attempts != '' && steps.attempts.outputs.attempts >= '5'
        run: |
          echo "Too many auto-fix attempts (${{ steps.attempts.outputs.attempts }}). Exiting."

      - name: Install deps (only for eslint/prettier)
        run: npm ci --silent

      - name: Run Prettier check
        id: prettier
        run: |
          npx prettier --check . || echo "fail"

      - name: Fix Prettier
        if: steps.prettier.outcome == 'failure' || (steps.prettier.outputs && steps.prettier.outputs.prettier == 'fail')
        run: |
          npx prettier --write .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-fix): apply Prettier formatting"
          fi

      - name: Run ESLint fix
        id: eslint
        run: |
          npx eslint . --fix || true
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-fix): apply ESLint --fix"
          fi

      - name: Update package-lock if needed
        id: lock
        run: |
          npm install --package-lock-only
          git add package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto-fix): update package-lock.json"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes to main
        if: ${{ steps.prettier.outcome == 'failure' || steps.eslint.outcome == 'failure' || steps.lock.outputs.changed == 'true' || github.event.workflow_run.conclusion == 'failure' }}
        run: |
          # If there are staged commits, push them. Otherwise create an empty commit to trigger rerun only if nothing changed.
          if git rev-parse --verify --quiet HEAD; then
            if ! git diff --staged --quiet; then
              git push origin HEAD:main
            else
              echo "No staged changes to push. Creating empty commit to trigger rerun."
              git commit --allow-empty -m "chore(auto-fix): trigger rerun after analysis"
              git push origin HEAD:main
            fi
          else
            echo "No HEAD verified. Exiting."
          fi
