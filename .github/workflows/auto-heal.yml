name: Auto Heal Failed Workflows

on:
  workflow_run:
    workflows: ['CI', 'Publish Worker Image', 'Publish Worker Image to Docker Hub']
    types: [completed]

jobs:
  heal:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 'stable'

      - name: Count previous auto-fixes
        id: attempts
        run: |
          COUNT=$(git log --pretty=%s -n 50 | grep -c "chore(auto-fix):" || true)
          echo "attempts=$COUNT" >> $GITHUB_OUTPUT

      - name: Stop if too many attempts
        if: steps.attempts.outputs.attempts != '' && steps.attempts.outputs.attempts >= '5'
        run: |
          echo "Too many auto-fix attempts (${{ steps.attempts.outputs.attempts }}). Exiting."

      - name: Install deps (only for eslint/prettier)
        run: npm ci --silent

      - name: Run Prettier check
        id: prettier
        continue-on-error: true
        run: |
          set +e
          npx prettier --check .
          PRETTIER_EXIT=$?
          set -e
          echo "prettier_exit=$PRETTIER_EXIT" >> $GITHUB_OUTPUT

      - name: Fix Prettier
        if: steps.prettier.outputs.prettier_exit != '0'
        run: |
          npx prettier --write .
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          # git diff --cached --quiet returns 0 when no staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-fix): apply Prettier formatting"
          fi

      - name: Run ESLint fix
        id: eslint
        run: |
          set +e
          npx eslint . --fix
          ESLINT_EXIT=$?
          set -e
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-fix): apply ESLint --fix"
          fi
          echo "eslint_exit=$ESLINT_EXIT" >> $GITHUB_OUTPUT

      - name: Update package-lock if needed
        id: lock
        run: |
          npm install --package-lock-only
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-fix): update package-lock.json"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changes to main
        if: ${{ github.event.workflow_run.conclusion == 'failure' || steps.prettier.outputs.prettier_exit == '1' || steps.eslint.outputs.eslint_exit == '1' || steps.lock.outputs.changed == 'true' }}
        run: |
          # If there are commits ready to push, push them. Otherwise create an empty commit to trigger rerun.
          if git rev-parse --verify --quiet HEAD; then
            if ! git diff --cached --quiet; then
              git push origin HEAD:main
            else
              echo "No changes detected to push. Creating empty commit to trigger rerun."
              git commit --allow-empty -m "chore(auto-fix): trigger rerun after analysis"
              git push origin HEAD:main
            fi
          else
            echo "No HEAD verified. Exiting."
          fi
