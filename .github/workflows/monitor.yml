name: Monitor JasnePismo

# Force JavaScript actions to run on Node.js 24 (opt into future runner behavior)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run monitoring script
        run: node ./scripts/check-monitor.js
        env:
          TARGET_URL: https://jasnepismo.pl
          # Monitoring now only checks public endpoints (e.g. /api/health). MONITOR_ADMIN_TOKEN omitted.
