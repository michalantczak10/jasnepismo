name: Health Check

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}

jobs:
  health:
    # Skip scheduled health-checks triggered by dependabot
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ''
    steps:
      - name: Health check
        env:
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "Missing secret HEALTHCHECK_URL. Set repository secret to your deployment's /api/health endpoint. Skipping health check.";
            exit 0;
          fi
          sudo apt-get update -y && sudo apt-get install -y jq curl >/dev/null
          echo "Pinging $HEALTHCHECK_URL"
          http_code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$HEALTHCHECK_URL" || echo "000")
          if [ "$http_code" != "200" ]; then
            echo "Health check failed: HTTP $http_code";
            echo "Response:";
            cat /tmp/health.json || true;
            exit 1;
          fi
          ok=$(jq -r '.status' /tmp/health.json 2>/dev/null || echo "")
          if [ "$ok" != "ok" ]; then
            echo "Service returned unexpected payload";
            cat /tmp/health.json;
            exit 1;
          fi
          echo "Health check OK"
