name: Auto Merge Auto-Fix PRs

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    env:
      # optional: set AUTOFIX_MERGE_TOKEN secret to a PAT with repo access to bypass strict branch protection rules
      AUTOFIX_MERGE_TOKEN: ${{ secrets.AUTOFIX_MERGE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Auto-merge PRs labeled auto-fix for successful CI
        uses: actions/github-script@v6
        with:
          script: |
            // Use PAT from AUTOFIX_MERGE_TOKEN if provided, otherwise use the workflow token
            const mergeToken = process.env.AUTOFIX_MERGE_TOKEN || process.env.GITHUB_TOKEN;
            const octokit = github.getOctokit(mergeToken);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const headSha = context.payload.workflow_run.head_sha;
            const pulls = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
            for (const pr of pulls.data) {
              try {
                const details = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                // Ensure PR was created by auto-heal branch naming convention and labeled auto-fix
                const headRef = details.data.head && details.data.head.ref ? details.data.head.ref : '';
                const labels = (details.data.labels || []).map(l => (typeof l === 'string' ? l : l.name));
                if (!headRef.startsWith('auto-fix/')) continue;
                if (!labels.includes('auto-fix')) continue;
                if (!(details.data.head && details.data.head.sha === headSha)) continue;

                core.info(`Merging PR #${pr.number} (${details.data.title}) using token override: ${mergeToken ? 'yes' : 'no'}`);
                await octokit.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: 'squash' });
              } catch (err) {
                core.warning(`Failed to merge PR #${pr.number}: ${err.message}`);
              }
            }
