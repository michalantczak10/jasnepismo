name: Publish Worker Image to Docker Hub

on:
  push:
    # Only publish to Docker Hub on semver tags to avoid running builds on every push
    tags: ['v*']

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-push:
    # Skip Docker Hub publishes for dependabot to avoid leaking tokens/credentials
    # Note: avoid referencing `secrets` in the job-level `if` expression because
    # some event contexts don't allow it. We'll check secrets at runtime in a
    # dedicated step and gate subsequent steps on that check.
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ''
    steps:
      - name: Check Docker Hub secrets
        id: check_secrets
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ] || [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "has_secrets=false" >> $GITHUB_OUTPUT
          else
            echo "has_secrets=true" >> $GITHUB_OUTPUT
          fi
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        if: ${{ steps.check_secrets.outputs.has_secrets == 'true' }}
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push worker image to Docker Hub
        if: ${{ steps.check_secrets.outputs.has_secrets == 'true' }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: worker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/jasnepismo-worker:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/jasnepismo-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
