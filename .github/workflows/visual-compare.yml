name: Visual compare

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  visual-compare:
    name: Visual comparison on PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}

      - name: Checkout base (target branch)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline-ref

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run visual comparison
        id: compare
        run: |
          set +e
          node scripts/compare-baseline.js
          rc=$?
          set -e
          echo "compare_exit_code=$rc" >> $GITHUB_OUTPUT
        continue-on-error: true
        env:
          BASELINE_REF_DIR: baseline-ref/e2e/baseline
          GENERATED_DIR: e2e/baseline-generated
          PIXELMATCH_THRESHOLD: '0.02'

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-compare-output
          path: e2e/baseline-generated/**

      - name: Comment PR with visual-compare result
        if: always()
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Visual comparison completed for this PR.

            - Compare exit code: ${{ steps.compare.outputs.compare_exit_code }}
            - Artifacts: `visual-compare-output` (download from workflow run)
            - Run details: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            If the compare exit code is `2`, visual differences exceeded the configured threshold. Please download the artifacts to inspect diffs and generated images.

