name: Assistant — trigger update-baseline and collect artifacts

env:
  FEATURE_WORKFLOW_ASSISTANT_TRIGGER: ${{ secrets.FEATURE_WORKFLOW_ASSISTANT_TRIGGER }}

on:
  workflow_dispatch:
  push:
    branches:
      - ci/cleanup-artifacts

permissions:
  contents: write

jobs:
  call-update-baseline:
    if: ${{ env.FEATURE_WORKFLOW_ASSISTANT_TRIGGER != '0' }}
    uses: ./.github/workflows/update-baseline.yml
    with:
      baseline_ref_dir: e2e/baseline
      generated_dir: e2e/baseline-generated
      pixelmatch_threshold: '0.02'
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  collect-or-fallback:
    needs: call-update-baseline
    if: ${{ env.FEATURE_WORKFLOW_ASSISTANT_TRIGGER != '0' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ensure jq is available
        run: sudo apt-get update && sudo apt-get install -y jq zip unzip || true

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download baseline-images artifact (if produced)
        if: ${{ needs.call-update-baseline.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: baseline-images
          path: downloads/artifacts

      - name: Fallback: run update-baseline logic locally (if call failed)
        if: ${{ needs.call-update-baseline.result != 'success' }}
        id: compare_fallback
        run: |
          set +e
          mkdir -p e2e/baseline-generated
          npm ci
          npx playwright install --with-deps || true
          node scripts/compare-baseline.js 2>&1 | tee e2e/baseline-generated/compare.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "compare_exit_code=$rc" >> $GITHUB_OUTPUT
        continue-on-error: true
        env:
          BASELINE_REF_DIR: e2e/baseline
          GENERATED_DIR: e2e/baseline-generated
          PIXELMATCH_THRESHOLD: '0.02'
        shell: bash

      - name: Upload generated artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: baseline-images
          path: e2e/baseline-generated/**

      - name: Commit collected compare files back to the repository (if any)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "Attempting to commit collected compare files back to repo"
          BRANCH="collected-compare-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          mkdir -p artifacts/compare
          cp -r downloads/artifacts/**/compare.log artifacts/compare/ 2>/dev/null || true
          cp -r downloads/artifacts/**/compare-summary.json artifacts/compare/ 2>/dev/null || true
          cp -r e2e/baseline-generated/**/compare.log artifacts/compare/ 2>/dev/null || true
          cp -r e2e/baseline-generated/**/compare-summary.json artifacts/compare/ 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            git add artifacts/compare || true
            git commit -m "ci: collected compare files from workflow ${{ github.run_id }}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" --set-upstream origin "$BRANCH" || true
          else
            echo "No compare files found to commit"
          fi

      - name: Wait for new run to appear
        if: ${{ env.DISPATCHED == 'true' }}
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TEMP_AGENT_PAT }}
          DISPATCH_TIME: ${{ env.DISPATCH_TIME }}
        run: |
          echo "Looking for a run created after $DISPATCH_TIME..."
          RUN_ID=''
          for i in $(seq 1 60); do
            sleep 5
            runs_json=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/workflows/update-baseline.yml/runs?per_page=10")
            # pick the first run with created_at >= DISPATCH_TIME
            RUN_ID=$(echo "$runs_json" | jq -r --arg dt "$DISPATCH_TIME" '.workflow_runs[] | select(.created_at >= $dt) | .id' | head -n1)
            if [ -n "$RUN_ID" ]; then
              echo "Found run id: $RUN_ID"
              echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
              break
            fi
            echo "Waiting for run to appear (attempt $i)..."
          done
          if [ -z "$RUN_ID" ]; then
            echo "Could not find a recent run for workflow after $DISPATCH_TIME" >&2
            exit 1
          fi

      - name: Poll run until completion
        if: ${{ env.DISPATCHED == 'true' }}
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TEMP_AGENT_PAT }}
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          echo "Polling run $RUN_ID until completed..."
          for i in $(seq 1 240); do
            sleep 5
            run_json=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID")
            status=$(echo "$run_json" | jq -r '.status')
            conclusion=$(echo "$run_json" | jq -r '.conclusion')
            echo "[$i] status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              echo "RUN_CONCLUSION=$conclusion" >> $GITHUB_ENV
              break
            fi
          done
          if [ "$status" != "completed" ]; then
            echo "Run did not complete in time" >&2
            exit 1
          fi

      - name: Download run logs (zip)
        if: ${{ env.DISPATCHED == 'true' }}
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TEMP_AGENT_PAT }}
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          echo "Downloading logs for run $RUN_ID..."
          curl -L -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/logs" -o "run-${RUN_ID}-logs.zip" || true
          if [ -f "run-${RUN_ID}-logs.zip" ]; then
            mkdir -p "run-${RUN_ID}-logs"
            unzip -q "run-${RUN_ID}-logs.zip" -d "run-${RUN_ID}-logs" || true
            echo "Extracted logs to run-${RUN_ID}-logs/"
          else
            echo "No logs zip downloaded"
          fi

      - name: Download artifacts for the run
        if: ${{ env.DISPATCHED == 'true' }}
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.TEMP_AGENT_PAT }}
          RUN_ID: ${{ env.RUN_ID }}
        run: |
          echo "Listing artifacts for run $RUN_ID..."
          artifacts_json=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts")
          echo "$artifacts_json" | jq -r '.artifacts[] | [.id, .name] | @tsv' > artifacts.list || true
          mkdir -p downloads/artifacts
          if [ -s artifacts.list ]; then
            while IFS=$'\t' read -r id name; do
              echo "Downloading artifact $name (id=$id)..."
              curl -L -H "Authorization: token $TOKEN" -H "Accept: application/octet-stream" \
                "https://api.github.com/repos/$REPO/actions/artifacts/$id/zip" -o "artifact-${id}.zip" || true
              if [ -f "artifact-${id}.zip" ]; then
                mkdir -p "downloads/artifacts/$name"
                unzip -q "artifact-${id}.zip" -d "downloads/artifacts/$name" || true
                echo "Extracted artifact-$id -> downloads/artifacts/$name"
              fi
            done < artifacts.list
          else
            echo "No artifacts found for run $RUN_ID"
          fi

      - name: Upload compare files (if present)
        if: ${{ env.DISPATCHED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: compare-files
          path: |
            run-${{ env.RUN_ID }}-logs/**/compare.log
            run-${{ env.RUN_ID }}-logs/**/compare-summary.json
            downloads/artifacts/**/compare.log
            downloads/artifacts/**/compare-summary.json
          if-no-files-found: warn

      - name: Print summary locations
        if: ${{ env.DISPATCHED == 'true' }}
        run: |
          echo "Artifacts and logs downloaded to workspace. If the 'compare-files' artifact exists in this run you can download it from the Actions UI."

      - name: Commit collected compare files back to the repository (if any)
        if: ${{ env.DISPATCHED == 'true' }}
        env:
          RUN_ID: ${{ env.RUN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "Attempting to commit collected compare files back to repo (run $RUN_ID)"
          BRANCH="collected-compare-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # create a branch and copy any found compare files into artifacts/compare/<RUN_ID>
          git checkout -b "$BRANCH"
          mkdir -p artifacts/compare/${RUN_ID}
          cp -r run-${RUN_ID}-logs/**/compare.log artifacts/compare/${RUN_ID}/ 2>/dev/null || true
          cp -r run-${RUN_ID}-logs/**/compare-summary.json artifacts/compare/${RUN_ID}/ 2>/dev/null || true
          cp -r downloads/artifacts/**/compare.log artifacts/compare/${RUN_ID}/ 2>/dev/null || true
          cp -r downloads/artifacts/**/compare-summary.json artifacts/compare/${RUN_ID}/ 2>/dev/null || true
          # ensure something to commit
          if [ -n "$(git status --porcelain)" ]; then
            git add artifacts/compare/${RUN_ID} || true
            git commit -m "ci: collected compare files from run ${RUN_ID}"
            echo "Pushing branch $BRANCH to origin"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" --set-upstream origin "$BRANCH"
          else
            echo "No compare files found to commit"
          fi
