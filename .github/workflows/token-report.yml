name: Token report

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: "mock" (safe) or "live" (uses OPENAI_API_KEY secret)'
        required: true
        default: 'mock'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run token report
        run: |
          if [ "${{ github.event.inputs.mode }}" = "mock" ]; then
            npm run report:tokens:mock
          else
            # requires OPENAI_API_KEY set in repository secrets
            npm run report:tokens
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload token report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-reports-${{ github.run_id }}
          path: monitoring/reports/
