name: Token report

on:
  schedule:
    - cron: '0 0 * * *' # daily at 00:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode: "mock" (safe) or "live" (uses OPENAI_API_KEY secret)'
        required: true
        default: 'mock'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run token report
        run: |
          echo "Mode: ${{ github.event.inputs.mode }}"
          if [ "${{ github.event.inputs.mode }}" = "mock" ]; then
            npm run report:tokens:mock
          else
            # run live only when REPORT_OPENAI secret explicitly set to '1'
            if [ "${{ secrets.REPORT_OPENAI }}" = "1" ]; then
              npm run report:tokens
            else
              echo "REPORT_OPENAI not enabled; aborting live run. Set repository secret REPORT_OPENAI=1 to enable.";
              exit 78
            fi
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REPORT_OPENAI: ${{ secrets.REPORT_OPENAI }}

      - name: Aggregate reports
        run: node scripts/aggregate-reports.js

      - name: Build summary from latest report
        run: node scripts/report-summary.js

      - name: Upload token report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: token-reports-${{ github.run_id }}
          path: monitoring/reports/
