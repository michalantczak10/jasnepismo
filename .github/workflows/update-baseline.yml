name: Update visual baseline
on:
  push:
    branches:
      - main
    paths:
      - 'e2e/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-baseline:
    name: Update visual baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Generate baseline
        run: node scripts/generate-baseline-fixed.js
      - name: Upload baseline artifacts
        uses: actions/upload-artifact@v4
        with:
          name: baseline-images
          path: e2e/baseline/**
      - name: Commit baseline if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add e2e/baseline || true
          if ! git diff --quiet --exit-code; then
            git commit -m 'chore: update visual baseline'
            git push
          else
            echo 'No baseline changes'
          fi
        shell: bash
