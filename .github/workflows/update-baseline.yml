name: Update visual baseline
env:
  FEATURE_WORKFLOW_UPDATE_BASELINE: ${{ secrets.FEATURE_WORKFLOW_UPDATE_BASELINE }}
on:
  push:
    branches:
      - main
    paths:
      - 'e2e/**'
  workflow_dispatch:
  workflow_call:
    inputs:
      baseline_ref_dir:
        description: 'Path to baseline ref dir (relative to repo)'
        required: false
        default: 'e2e/baseline'
        type: string
      generated_dir:
        description: 'Output dir for generated images (relative to repo)'
        required: false
        default: 'e2e/baseline-generated'
        type: string
      pixelmatch_threshold:
        description: 'Pixelmatch threshold (0..1)'
        required: false
        default: '0.02'
        type: string
    secrets:
      WORKFLOW_GITHUB_TOKEN:
        required: false
permissions:
  contents: write
jobs:
  update-baseline:
    name: Update visual baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Verify Playwright installation
        run: |
          echo "Playwright CLI version:"
          npx playwright --version || true
          echo "Node require check for Playwright modules:"
          node -e "try{require('playwright'); console.log('playwright: ok')}catch(e){console.log('playwright: not available')}"
          node -e "try{require('playwright-core'); console.log('playwright-core: ok')}catch(e){console.log('playwright-core: not available')}"
          node -e "try{require('@playwright/test'); console.log('@playwright/test: ok')}catch(e){console.log('@playwright/test: not available')}"
          echo "List Playwright cache (if present):"
          ls -la ~/.cache/ms-playwright || true
        shell: bash

      - name: Prepare env from inputs (supports workflow_call)
        run: |
          echo "BASELINE_REF_DIR=${{ github.event_name == 'workflow_call' && inputs.baseline_ref_dir || 'e2e/baseline' }}" >> $GITHUB_ENV
          echo "GENERATED_DIR=${{ github.event_name == 'workflow_call' && inputs.generated_dir || 'e2e/baseline-generated' }}" >> $GITHUB_ENV
          echo "PIXELMATCH_THRESHOLD=${{ github.event_name == 'workflow_call' && inputs.pixelmatch_threshold || '0.02' }}" >> $GITHUB_ENV
        shell: bash

      # Run the visual comparison script. It runs the generator into
      # GENERATED_DIR and compares against BASELINE_REF_DIR. The script
      # exits with code 0 when differences are <= threshold, 2 when
      # differences exceed threshold, and >2 on error. We capture the
      # exit code into an output for subsequent conditional steps.
      - name: Run visual comparison
        id: compare
        run: |
          set +e
          mkdir -p "$GENERATED_DIR"
          node scripts/compare-baseline.js 2>&1 | tee "$GENERATED_DIR/compare.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "compare_exit_code=$rc" >> $GITHUB_OUTPUT
        continue-on-error: true
        env:
          BASELINE_REF_DIR: e2e/baseline
          GENERATED_DIR: e2e/baseline-generated
          PIXELMATCH_THRESHOLD: '0.02'

      - name: Upload generated artifacts (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-images
          path: e2e/baseline-generated/**

      - name: Prepare baseline update
        if: ${{ steps.compare.outputs.compare_exit_code == '2' }}
        run: |
          echo 'Copying generated images into e2e/baseline to prepare PR'
          mkdir -p e2e/baseline
          cp -r e2e/baseline-generated/* e2e/baseline/ || true
          git status --porcelain
        shell: bash

      - name: Create Pull Request for baseline changes
        id: create_pr
        if: ${{ steps.compare.outputs.compare_exit_code == '2' }}
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.WORKFLOW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore: update visual baseline"
          branch: update-visual-baseline-${{ github.run_id }}
          title: "chore: update visual baseline"
          body: |
            This PR was opened automatically by CI because generated visual
            baseline images differ from the checked-in baseline. Please review
            the new images in the `e2e/baseline` folder and merge if acceptable.
          base: main
          labels: automated,visual-baseline

      - name: Comment PR with image previews
        if: ${{ steps.compare.outputs.compare_exit_code == '2' }}
        uses: peter-evans/create-or-update-comment@v3
        with:
          token: ${{ secrets.WORKFLOW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          issue-number: ${{ steps.create_pr.outputs.pull_request_number }}
          body: |
            ✅ New visual baseline images were generated and a PR was created: ${{ steps.create_pr.outputs.pull_request_url }}

            Preview of generated images (click to open full size):

            ![hero](https://raw.githubusercontent.com/${{ github.repository }}/update-visual-baseline-${{ github.run_id }}/e2e/baseline/hero.png)
            ![hero@2x](https://raw.githubusercontent.com/${{ github.repository }}/update-visual-baseline-${{ github.run_id }}/e2e/baseline/hero@2x.png)
            
            ![hero_full](https://raw.githubusercontent.com/${{ github.repository }}/update-visual-baseline-${{ github.run_id }}/e2e/baseline/hero_full.png)
            ![hero_full@2x](https://raw.githubusercontent.com/${{ github.repository }}/update-visual-baseline-${{ github.run_id }}/e2e/baseline/hero_full@2x.png)

            Diff images are attached in the PR file changes (or in the workflow artifacts).

      - name: Fail on compare error
        if: ${{ steps.compare.outputs.compare_exit_code != '0' && steps.compare.outputs.compare_exit_code != '2' }}
        run: |
          echo "Compare script exited with unexpected code ${{ steps.compare.outputs.compare_exit_code }}"
          exit 1
        shell: bash

# Automated minor whitespace/comment change to ensure branch differs from main
# (safe no-op change to trigger PR creation and merge)

