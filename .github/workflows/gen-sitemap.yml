name: Generate sitemap

# Force JavaScript actions to run on Node.js 24 (opt into future runner behavior)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# Allow the workflow token to write contents (needed to push commits)
permissions:
  contents: write

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  gen-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate sitemap
        run: npm run gen:sitemap

      - name: Commit and push if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain sitemap.xml sitemap.xml.gz)" ]; then
            git add sitemap.xml sitemap.xml.gz
            git commit -m "chore: update sitemap [skip ci]"
            git push
          else
            echo "No sitemap changes"
          fi

