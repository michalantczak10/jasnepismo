name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  monitor:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check site health
        run: |
          echo "Pinging production health endpoint"
          curl -fS https://jasnepismo.pl/api/health || exit 1
