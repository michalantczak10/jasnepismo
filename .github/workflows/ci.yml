name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Cache NPM
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --silent

      - name: Run tests
        run: npm test --if-present --silent

  monitor:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check site health
        run: |
          echo "Pinging production health endpoint"
          curl -fS https://jasnepismo.pl/api/health || exit 1
