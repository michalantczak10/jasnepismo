name: CI

# Force JavaScript actions to run on Node.js 24 (opt into future runner behavior)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
      - name: Validate favicons
        run: node scripts/check-favicons.js

      - name: Lint
        run: npx eslint . --ext .js,.cjs || true

      - name: Run tests
        run: npm test
