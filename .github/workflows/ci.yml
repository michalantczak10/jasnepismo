name: CI

env:
  # Use the latest stable Node.js on runners. Previously forced Node 24 which
  # raised deprecation warnings for some actions targeting Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ''

on:
  # Run CI on pull requests and manually. Avoid running heavy CI on every push
  # to main to reduce noise while we stabilize workflows.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    env:
      CI: true
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Fail early if auto-heal trigger file exists
        # This step allows us to intentionally trigger a failure on main for testing
        # the auto-heal flow. It will exit 1 if the repository contains the
        # file .auto_heal_fail at the root.
        run: |
          if [ -f .auto_heal_fail ]; then
            echo "Intentional failure triggered by .auto_heal_fail";
            exit 1;
          else
            echo "No intentional failure trigger found.";
          fi

      - name: Use Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Cache NPM
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        # Some runner environments can fail installing optional/native deps;
        # don't fail the entire CI on install errors — the rest of the job
        # can still provide useful diagnostics.
        continue-on-error: true
        run: npm ci --silent || true

      - name: Lint
        # Lint should warn but not fail the entire CI for now; keep it visible in logs.
        continue-on-error: true
        run: npm run lint || true

      - name: Format check
        # Allow formatting issues to be non-fatal because we enforce formatting
        # locally via Husky + lint-staged. This prevents CI noise from failing runs.
        continue-on-error: true
        run: npm run format:check || true

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

      - name: Install Playwright browsers
        # Playwright install can be flaky on some runners; allow it to fail
        # without failing the entire CI (tests depending on it may still fail).
        continue-on-error: true
        run: npx playwright install --with-deps || true

      - name: Run all tests
        # Allow tests to fail without failing whole CI; keep logs for debugging.
        continue-on-error: true
        run: npm run test:all --if-present --silent || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/**

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod --yes'
