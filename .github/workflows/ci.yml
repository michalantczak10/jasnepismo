name: CI

  env:
  # Use the latest stable Node.js on runners. Previously forced Node 24 which
  # raised deprecation warnings for some actions targeting Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ''

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: true
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js (LTS)
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Cache NPM
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Show versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci --silent

      - name: Lint
        # Lint should warn but not fail the entire CI for now; keep it visible in logs.
        continue-on-error: true
        run: npm run lint || true

      - name: Format check
        # Allow formatting issues to be non-fatal because we enforce formatting
        # locally via Husky + lint-staged. This prevents CI noise from failing runs.
        continue-on-error: true
        run: npm run format:check || true

      - name: Audit dependencies
        run: npm audit --audit-level=moderate || true

      - name: Install Playwright browsers
        # Playwright install can be flaky on some runners; allow it to fail
        # without failing the entire CI (tests depending on it may still fail).
        continue-on-error: true
        run: npx playwright install --with-deps || true

      - name: Run all tests
        run: npm run test:all --if-present --silent

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/**

      - name: Deploy to Vercel
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod --yes'
