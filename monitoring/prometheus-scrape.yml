# Prometheus scrape config for jasnepismo
# Replace HOST:PORT with your target. Two options for auth shown below.
scrape_configs:
  - job_name: 'jasnepismo'
    static_configs:
      - targets: ['HOST:PORT']  # e.g. example.com:443
    metrics_path: /api/metrics
    scheme: https
    # Option A (recommended): store the token on disk and point Prometheus to it
    # Create the file on the Prometheus host (e.g. /etc/metrics/METRICS_TOKEN) and set permissions so prometheus can read it.
    bearer_token_file: /etc/metrics/METRICS_TOKEN

    # Option B: pass an Authorization header (support depends on Prometheus version)
    # If your Prometheus supports custom headers, configure the Authorization header like:
    # extra_headers:
    #   Authorization: ["Bearer <TOKEN>"]

    # TLS settings example (optional):
    # tls_config:
    #   insecure_skip_verify: false
