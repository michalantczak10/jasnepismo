<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Footer preview</title>
    <link rel="stylesheet" href="styles.v18.css" />
    <style>
      body {
        background: #f7f3ea;
        padding: 40px;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      .preview {
        max-width: 720px;
        margin: 20px auto;
      }
      h3 {
        font-weight: 700;
        margin: 12px 0;
      }
      .preview-controls {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 14px;
      }
      .preview-controls label {
        font-weight: 700;
      }
      /* local preview overrides for blue variant */
      .hero-cta.cta-blue,
      .footer-email-link.cta-blue {
        background: linear-gradient(90deg, #2f80ed 0%, #1a73e8 100%) !important;
        color: #fff !important;
        border-color: rgba(0, 0, 0, 0.06) !important;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.14) !important;
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <div class="preview-controls">
        <label for="ctaVariant">Wariant CTA:</label>
        <select id="ctaVariant">
          <option value="warm">Ciepły (domyślny)</option>
          <option value="blue">Niebieski</option>
        </select>
        <small style="color: #666; margin-left: 8px">(podgląd kolorów dla stopki)</small>
      </div>

      <h3 id="variantHeading">Wariant: ciepły (domyślny)</h3>

      <footer class="site-footer">
        <div class="footer-inner">
          <p class="footer-subtitle">
            Pomagamy z oficjalnymi pismami — od urzędów i spółdzielni po szkoły.
          </p>
          <address class="footer-contact">
            <p class="footer-contact-title">Napisz do nas</p>
            <a class="hero-cta footer-email-link cta-warm" href="mailto:kontakt@jasnepismo.pl">
              <span class="footer-emoji" aria-hidden="true">📧</span>
              <span class="footer-email-text">kontakt@jasnepismo.pl</span>
            </a>
          </address>
        </div>
      </footer>
    </div>

    <script>
      (function () {
        const sel = document.getElementById('ctaVariant');
        const heading = document.getElementById('variantHeading');
        function applyVariant(v) {
          document.querySelectorAll('.hero-cta, .footer-email-link').forEach((el) => {
            el.classList.remove('cta-warm', 'cta-blue');
            if (v === 'blue') el.classList.add('cta-blue');
            else el.classList.add('cta-warm');
          });
          heading.textContent = v === 'blue' ? 'Wariant: niebieski' : 'Wariant: ciepły (domyślny)';
        }
        sel.addEventListener('change', () => applyVariant(sel.value));
        // set initial
        applyVariant(sel.value || 'warm');
      })();
    </script>
  </body>
</html>
