<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Footer preview</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        background: #f7f3ea;
        padding: 40px;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          'Helvetica Neue',
          Arial,
          sans-serif;
      }
      .preview {
        max-width: 720px;
        margin: 20px auto;
      }
      h3 {
        font-weight: 700;
        margin: 18px 0;
      }
    </style>
  </head>
  <body>
    <div class="preview">
      <h3>CTA: wariant ciepły (domyślny)</h3>
      <footer class="site-footer">
        <div class="footer-inner">
          <p class="footer-subtitle">
            Pomagamy z oficjalnymi pismami — od urzędów i spółdzielni po szkoły.
          </p>
          <address class="footer-contact">
            <a class="footer-email-link cta-warm" href="mailto:kontakt@jasnepismo.pl">
              <img src="/img/email.svg" alt="" class="footer-email-icon" width="18" height="18" />
              <span class="footer-email-text">Masz pytanie? Napisz: kontakt@jasnepismo.pl</span>
            </a>
          </address>
        </div>
      </footer>

      <h3>CTA: wariant niebieski</h3>
      <footer class="site-footer">
        <div class="footer-inner">
          <p class="footer-subtitle">
            Pomagamy z oficjalnymi pismami — od urzędów i spółdzielni po szkoły.
          </p>
          <address class="footer-contact">
            <a class="footer-email-link cta-blue" href="mailto:kontakt@jasnepismo.pl">
              <img src="/img/email.svg" alt="" class="footer-email-icon" width="18" height="18" />
              <span class="footer-email-text">Masz pytanie? Napisz: kontakt@jasnepismo.pl</span>
            </a>
          </address>
        </div>
      </footer>
    </div>
  </body>
</html>
