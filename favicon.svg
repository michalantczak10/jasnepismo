<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#c21b1b"/>
      <stop offset="100%" stop-color="#8f0000"/>
    </linearGradient>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- rounded background -->
  <rect width="100%" height="100%" rx="72" fill="url(#bgGrad)" />

  <!-- paper with subtle shadow -->
  <g transform="translate(88,72)">
    <rect x="0" y="0" width="336" height="368" rx="18" fill="#fff" filter="url(#paperShadow)" />
    <!-- folded corner: smoother -->
    <path d="M272 0 L328 56 L272 56 Z" fill="#f6f6f6" opacity="0.95"/>

    <!-- thin subtle lines representing text -->
    <g transform="translate(36,78)" fill="#b30000">
      <rect x="0" y="0" width="264" height="12" rx="6" opacity="0.95" />
      <rect x="0" y="28" width="220" height="10" rx="6" opacity="0.9" />
      <rect x="0" y="52" width="200" height="10" rx="6" opacity="0.9" />
      <rect x="0" y="76" width="160" height="10" rx="6" opacity="0.9" />
    </g>

    <!-- small accent: circular badge bottom-right -->
    <g transform="translate(220,260)">
      <circle cx="28" cy="28" r="28" fill="#b30000" />
      <path d="M18 28 L24 34 L38 20" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>
  </g>
</svg>

